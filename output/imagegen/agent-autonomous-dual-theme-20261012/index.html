<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChemWorld · Agent 自主探索双主题</title><style>:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#18212b;background:#f3f5f7}body{max-width:1500px;margin:auto;padding:32px}h1{font-size:32px}p{line-height:1.8;color:#627181}nav{display:flex;gap:12px;margin:24px 0;flex-wrap:wrap}button,a{font:inherit}button{padding:10px 20px;border:1px solid #bdcbd7;border-radius:6px;background:white;cursor:pointer}button[aria-pressed=true]{background:#5742db;color:white;border-color:#5742db}a{color:#6953db}img{width:100%;border-radius:8px;border:1px solid #c6d0da}body.dark{background:#10151c;color:#e6edf3}body.dark p{color:#a2b2c3}body.dark button:not([aria-pressed=true]){background:#18212b;color:#e6edf3}body.dark img{border-color:#2b3947}.note{max-width:1000px}button:focus-visible,a:focus-visible{outline:3px solid #8572ed;outline-offset:4px}</style></head><body><h1>Agent 自主探索</h1><p>同一布局，两种主题。人主要配置与观看，手动实验为额外入口。</p><nav><button data-theme="light" aria-pressed="true">浅色模式</button><button data-theme="dark" aria-pressed="false">深色模式</button><a href="README.md">设计与复现说明</a><a href="prompts.json">提示词</a></nav><a id="original" href="light.png" target="_blank"><img id="preview" src="light.png" alt="ChemWorld Agent 自主探索浅色设计稿"></a><p class="note">概念设计，图中数值不是实验结果。当前实现范围与运行器能力见设计说明。</p><script>document.querySelectorAll("button[data-theme]").forEach(b=>b.onclick=()=>{const t=b.dataset.theme;document.body.classList.toggle("dark",t==="dark");document.querySelectorAll("button[data-theme]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));document.getElementById("preview").src=t+".png";document.getElementById("preview").alt="ChemWorld Agent 自主探索"+(t==="dark"?"深色":"浅色")+"设计稿";document.getElementById("original").href=t+".png"});</script></body></html>
