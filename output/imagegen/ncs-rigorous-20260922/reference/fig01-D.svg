   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="28.17" y="41.785189" transform="rotate(-0 28.17 41.785189)">a  Private process model</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(28.17 72.958786)">Process laws and parameters</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(28.17 85.430325)">Persistent material state</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(28.17 97.901864)">Declared resources and legal operations</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="312.75" y="41.405268" transform="rotate(-0 312.75 41.405268)">b  Public research interface</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(312.75 72.578864)">Opaque / Aligned / MisIndexed</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(312.75 84.35754)">Same world; different supplied information</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(312.75 96.136215)">Task-specific goals and observations</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="19.8" y="161.388288" transform="rotate(-0 19.8 161.388288)">c  Autonomous research and sealed assessment</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202c37" x="195.57" y="194.208493" transform="rotate(-0 195.57 194.208493)">Research: select → observe → revise</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202c37" x="195.57" y="252.753133" transform="rotate(-0 195.57 252.753133)">Seal operating recommendation</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202c37" x="195.57" y="311.297773" transform="rotate(-0 195.57 311.297773)">K1: Free-form mechanism</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202c37" x="195.57" y="369.842413" transform="rotate(-0 195.57 369.842413)">Q: Predict 12 new conditions</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202c37" x="195.57" y="428.387053" transform="rotate(-0 195.57 428.387053)">K2: Retrospective reflection</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="396.45" y="243.270466" transform="rotate(-0 396.45 243.270466)">Independent retest</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="396.45" y="274.444062" transform="rotate(-0 396.45 274.444062)">Sealed recommendation</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(382.5 334.433072)">12 or 24 batches</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(382.5 346.857615)">Matching measurement allowance</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(382.5 359.282158)">Full source history retained for Q</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(382.5 371.706701)">Retest outcomes withheld from Q</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(382.5 384.131244)">K2 cannot revise Q</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="19.8" y="484.98048" transform="rotate(-0 19.8 484.98048)">d  Scope and readouts</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(19.8 505.429278)">Nine supported task families; six studied: EC, PA, RX, EQ, C, P.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(19.8 516.51509)">240 campaigns; 238 conforming chains; 3,597 / 3,600 assays; 720 / 720 posttest stages.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(19.8 527.600903)">Separate readouts: prediction error, intervals and independent task retests.</text>
   </g>
  </g>
