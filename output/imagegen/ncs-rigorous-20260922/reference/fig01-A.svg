   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="25.38" y="41.962597" transform="rotate(-0 25.38 41.962597)">a  Programmable world</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(25.38 67.813954)">Private process laws</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(25.38 80.285493)">Persistent materials and samples</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(25.38 92.757032)">Operations, instruments, resources</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(25.38 105.228571)">Declared public observations</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="246.348" y="41.582676" transform="rotate(-0 246.348 41.582676)">b  Autonomous research</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(246.348 67.434032)">Opaque / Aligned / MisIndexed</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(246.348 79.212708)">Same world; different supplied information</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(246.348 90.991383)">Task-specific research commission</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(246.348 102.770059)">12 or 24 batches + matching measurements</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="487.404" y="41.582676" transform="rotate(-0 487.404 41.582676)">c  Experimental feedback</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(487.404 67.434032)">Select an operation</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(487.404 79.212708)">Observe the declared result</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(487.404 90.991383)">Revise the next experiment</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(487.404 102.770059)">Full action-observation history</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="15.336" y="161.6544" transform="rotate(-0 15.336 161.6544)">d  Recommendation and post-experiment assessment</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202c37" x="88.992" y="203.167597" transform="rotate(-0 88.992 203.167597)">Seal recommendation</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202c37" x="263.088" y="203.167597" transform="rotate(-0 263.088 203.167597)">K1: Mechanism</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202c37" x="423.792" y="203.167597" transform="rotate(-0 423.792 203.167597)">Q: Prediction</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202c37" x="591.192" y="203.167597" transform="rotate(-0 591.192 203.167597)">K2: Retrospective</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="25.38" y="282.541232" transform="rotate(-0 25.38 282.541232)">Independent retest</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="25.38" y="308.392588" transform="rotate(-0 25.38 308.392588)">Sealed operating recommendation</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(209.52 268.284994)">K1: free-form account; no fixed equation template</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(209.52 281.440392)">Q: 12 new conditions, point and interval predictions</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(209.52 294.595791)">K2: reflection after Q; cannot revise sealed predictions</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="209.52" y="316.8864" transform="rotate(-0 209.52 316.8864)">Q retains the full source history; retest outcomes are not supplied to Q.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="25.38" y="360.917076" transform="rotate(-0 25.38 360.917076)">e  Controlled scope</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(25.38 386.768432)">Change process laws under matched interfaces, or</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(25.38 398.547108)">change supplied information within the same world.</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(25.38 410.325783)">Platform: nine task families; study: EC, PA, RX, EQ, C, P.</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c37" x="366.876" y="360.917076" transform="rotate(-0 366.876 360.917076)">f  Readouts and retained outcomes</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(366.876 386.768432)">Prediction MAE; interval coverage and width; task retests</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(366.876 398.547108)">240 campaigns; 238 conforming research chains</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #202c37" transform="translate(366.876 410.325783)">3,597 / 3,600 final assays; 720 / 720 K1, Q, K2 stages</text>
   </g>
  </g>
 </g>
