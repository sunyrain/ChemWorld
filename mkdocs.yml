site_name: ChemWorld
site_description: 用于训练和评测实验智能体的可回放物理化学因果世界与交互环境。
site_url: https://sunyrain.github.io/ChemWorld/
repo_url: https://github.com/sunyrain/ChemWorld
repo_name: sunyrain/ChemWorld
edit_uri: edit/main/docs/
copyright: ChemWorld · 物理化学机理世界与 Agent 评测环境，不用于指导真实实验

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    # Keep top-level groups as native collapsible navigation items; Material's
    # sections mode renders them as permanently expanded headings.
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          site_description: A replayable causal physical-chemistry environment for training and evaluating experimental agents.
          copyright: ChemWorld · Mechanistic world models and agent evaluation, not instructions for physical laboratory work
          nav:
            - Home: index.md
            - Research Thesis:
                - Why ChemWorld: vision.md
                - Experimental Intelligence: experimental_intelligence.md
                - Causal Worlds: causal_worlds.md
                - System Model: architecture.md
            - Evaluation & Evidence:
                - Benchmark Design: benchmark_overview.md
                - Confirmatory Benchmark Tasks: flagship_experiments.md
                - Research Findings: research_findings.md
            - From Simulation to Reality:
                - Blender Laboratory: blender_lab.md
                - Real-world Bridge: real_world_bridge.md

extra_css:
  - assets/stylesheets/language-switch.css
  - assets/stylesheets/site.css

extra_javascript:
  - assets/javascripts/navigation-v7.js

nav:
  - 首页: index.md
  - 研究与证据:
      - 为什么需要 ChemWorld: vision.md
      - 什么是实验智能: experimental_intelligence.md
      - 研究发现: research_findings.md
      - 证据与当前状态: benchmark_release.md
      - 适用范围与证据边界: limitations.md
      - 从虚拟世界到真实实验: real_world_bridge.md
  - 体验 ChemWorld:
      - 一次闭环实验: one_experiment.md
      - 会改变规律的世界: causal_worlds.md
      - 展示世界与任务: worlds.md
      - 打开可视化界面: interactive_task_lab.md
      - Blender 实验室与助手: blender_lab.md
      - 五分钟开始: getting_started.md
  - 构建与评测:
      - 规范系统模型: architecture.md
      - 完整任务目录: tasks.md
      - 选择交互层级: agent_tracks.md
      - Agent API: agent_interface.md
      - RL 与 World Model: world_model_learning.md
      - LLM 实验智能体: llm_agent_harness.md
      - Benchmark 设计: benchmark_overview.md
      - 旗舰实验: flagship_experiments.md
      - 公平评测协议: benchmark_protocol.md
      - 提交、回放与私有评测: submission.md
      - 结果可信链: release_integrity.md
  - 技术参考: reference_index.md
