name: Documentation build (no deployment)

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'pyproject.toml', 'uv.lock', '.github/workflows/docs.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.20'
          python-version: '3.12'
      - run: uv sync --locked --extra docs
      - run: uv run --no-sync mkdocs build --strict
